<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Metálico Premium (White to Titanium) -->
    <linearGradient id="griot-monochrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#91919E" />
    </linearGradient>

    <!-- Aura de luz ambiente subtil atrás do símbolo -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fundo Dark de Ultra Alto Contraste -->
  <rect width="512" height="512" rx="128" fill="#060608" />

  <!-- Luz de Fundo sutil -->
  <circle cx="256" cy="256" r="230" fill="url(#ambient-glow)" />

  <!-- SÍMBOLO PRINCIPAL (O ELO INFINITO 'G' — Proporção equilibrada, um pouco maior que a versão original) -->
  <g transform="translate(256, 256) scale(1.20) translate(-257, -256)">
    <!-- O Nó de Memória Contínuo -->
    <path d="M 196 186 
             C 130 186, 130 256, 196 256 
             C 262 256, 262 326, 328 326 
             C 394 326, 394 256, 328 256 
             C 262 256, 262 186, 196 186 Z" 
          fill="none" 
          stroke="url(#griot-monochrome)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- O Traço Horizontal (Transforma o nó no 'G' minimalista) -->
    <line x1="328" y1="256" x2="385" y2="256" 
          stroke="url(#griot-monochrome)" 
          stroke-width="26" 
          stroke-linecap="round" />
  </g>
</svg>
