name: test-griot-engine

on:
  push:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "data/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "data/**"
      - ".github/workflows/test.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q griot_engine.py griot_context.py griot_gir.py griot_semantic_ir.py griot_reasoning_v040.py griot_cognition_v100.py griot_provenance.py griot_working_graph.py griot_query_planner.py griot_ambiguity.py griot_polysemy.py griot_coreference.py griot_discourse.py griot_metaphor.py griot_intent.py griot_math.py griot_simulation.py griot_worldmodel_v070.py griot_planning_v080.py griot_hypothesis_v050.py griot_counterfactual.py griot_causality.py griot_verification.py griot_extraction.py griot_validation.py griot_deduplication.py griot_consolidation.py griot_promotion.py griot_demotion.py griot_versioning.py griot_incremental.py griot_indices.py griot_storage.py griot_sharding.py griot_cache.py griot_distributed_working_graph.py griot_selective_retrieval.py griot_scale.py griot_runtime.py griot_gir.py griot_integration_pipeline.py griot_execution_control.py griot_semantic_grammar.py griot_reasoning_invariants.py griot_lexical_semantics.py quid_core.py
      - name: A1 integration tests
        run: python -m unittest tests.test_a1_core_integration -v
      - name: A2 GIR contract tests
        run: python -m unittest tests.test_a2_gir_contract -v
      - name: A3 Context Engine tests
        run: python -m unittest tests.test_a3_context_engine -v
      - name: A4 unified reasoning tests
        run: python -m unittest tests.test_a4_reasoning_engine -v
      - name: A5 provenance and epistemic tests
        run: python -m unittest tests.test_a5_provenance_epistemic -v
      - name: A6 Working Graph tests
        run: python -m unittest tests.test_a6_working_graph -v
      - name: A7 Query Planner tests
        run: python -m unittest tests.test_a7_query_planner -v
      - name: B1 ambiguity tests
        run: python -m unittest tests.test_b1_ambiguity -v
      - name: B2 polysemy tests
        run: python -m unittest tests.test_b2_polysemy -v
