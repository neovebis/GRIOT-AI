name: test-griot-engine

on:
  push:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "data/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "data/**"
      - ".github/workflows/test.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q griot_engine.py griot_context.py griot_gir.py griot_semantic_ir.py griot_reasoning_v040.py griot_cognition_v100.py griot_provenance.py griot_working_graph.py griot_query_planner.py griot_ambiguity.py griot_polysemy.py griot_coreference.py griot_discourse.py griot_metaphor.py griot_intent.py griot_math.py griot_simulation.py griot_worldmodel_v070.py griot_planning_v080.py griot_hypothesis_v050.py griot_counterfactual.py griot_causality.py griot_verification.py griot_extraction.py griot_validation.py griot_deduplication.py griot_consolidation.py griot_promotion.py griot_demotion.py griot_versioning.py griot_incremental.py griot_indices.py griot_storage.py griot_sharding.py griot_cache.py quid_core.py
      - name: A1 integration tests
        run: python -m unittest tests.test_a1_core_integration -v
      - name: A2 GIR contract tests
        run: python -m unittest tests.test_a2_gir_contract -v
      - name: A3 Context Engine tests
        run: python -m unittest tests.test_a3_context_engine -v
      - name: A4 unified reasoning tests
        run: python -m unittest tests.test_a4_reasoning_engine -v
      - name: A5 provenance and epistemic tests
        run: python -m unittest tests.test_a5_provenance_epistemic -v
      - name: A6 Working Graph tests
        run: python -m unittest tests.test_a6_working_graph -v
      - name: A7 Query Planner tests
        run: python -m unittest tests.test_a7_query_planner -v
      - name: B1 ambiguity tests
        run: python -m unittest tests.test_b1_ambiguity -v
      - name: B2 polysemy tests
        run: python -m unittest tests.test_b2_polysemy -v
      - name: B3 coreference tests
        run: python -m unittest tests.test_b3_coreference -v
      - name: B4 discourse context tests
        run: python -m unittest tests.test_b4_discourse_context -v
      - name: B5 metaphor tests
        run: python -m unittest tests.test_b5_metaphor -v
      - name: B6 semantic intent tests
        run: python -m unittest tests.test_b6_semantic_intent -v
      - name: C1 mathematics tests
        run: python -m unittest tests.test_c1_mathematics -v
      - name: C2 simulation tests
        run: python -m unittest tests.test_c2_simulation -v
      - name: C3 planning tests
        run: python -m unittest tests.test_c3_planning -v
      - name: C4 hypothesis tests
        run: python -m unittest tests.test_c4_hypotheses -v
      - name: C5 counterfactual tests
        run: python -m unittest tests.test_c5_counterfactual -v
      - name: C6 causality tests
        run: python -m unittest tests.test_c6_causality -v
      - name: C7 verification tests
        run: python -m unittest tests.test_c7_verification -v
      - name: D1 extraction tests
        run: python -m unittest tests.test_d1_extraction -v
      - name: D2 validation tests
        run: python -m unittest tests.test_d2_validation -v
      - name: D3 deduplication tests
        run: python -m unittest tests.test_d3_deduplication -v
      - name: D4 consolidation tests
        run: python -m unittest tests.test_d4_consolidation -v
      - name: D5 promotion tests
        run: python -m unittest tests.test_d5_promotion -v
      - name: D6 demotion tests
        run: python -m unittest tests.test_d6_demotion -v
      - name: D7 versioning tests
        run: python -m unittest tests.test_d7_versioning -v
      - name: D8 incremental learning tests
        run: python -m unittest tests.test_d8_incremental_learning -v
      - name: E2 index tests
        run: python -m unittest tests.test_e2_indices -v
      - name: E3 sharding tests
        run: python -m unittest tests.test_e3_sharding -v
      - name: E4 cache tests
        run: python -m unittest tests.test_e4_cache -v
      - name: Unit tests
        run: python -m unittest discover -s tests -v
