name: test-griot-engine

on:
  push:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "data/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "data/**"
      - ".github/workflows/test.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q griot_engine.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
