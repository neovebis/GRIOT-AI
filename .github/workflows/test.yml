name: test-griot-engine

on:
  push:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "data/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "data/**"
      - ".github/workflows/test.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q griot_engine.py griot_context.py griot_gir.py griot_semantic_ir.py griot_reasoning_v040.py quid_core.py
      - name: A1 integration tests
        run: python -m unittest tests.test_a1_core_integration -v
      - name: A2 GIR contract tests
        run: python -m unittest tests.test_a2_gir_contract -v
      - name: A3 Context Engine tests
        run: python -m unittest tests.test_a3_context_engine -v
      - name: Unit tests
        run: python -m unittest discover -s tests -v
