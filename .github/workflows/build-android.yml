name: GRIOT Mobile Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 platforms;android-34 build-tools;35.0.0 build-tools;34.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify release version identity
        run: |
          set -euo pipefail
          PACKAGE_VER=$(node -p "require('./package.json').version")
          GRADLE_VER=$(grep 'versionName' android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | head -n 1 | awk '{print $2}')

          echo "package.json version: $PACKAGE_VER"
          echo "Gradle versionName: $GRADLE_VER"
          echo "Gradle versionCode: $VERSION_CODE"

          test "$PACKAGE_VER" = "$GRADLE_VER"
          test "$GRADLE_VER" = "1.1.06"
          test "$VERSION_CODE" = "106"

          echo "RELEASE_TAG=v$GRADLE_VER" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=GRIOT Mobile v$GRADLE_VER" >> "$GITHUB_ENV"

      - name: Generate Android Assets (Icons & Splash)
        run: node scripts/generate-android-assets.mjs

      - name: Validate runtime runner
        run: |
          node --check runtime-runner/server.mjs
          node --test runtime-runner/runtime-runner.test.mjs

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Sync GRIOT native integration
        run: node scripts/sync-griot-native.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure Permanent Release Keystore
        run: |
          if [ -f "android/app/griot-release.keystore" ]; then
            echo "Permanent release keystore already present."
          else
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/griot-release.keystore \
              -alias griot-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "GriotMobileApp2026!" \
              -keypass "GriotMobileApp2026!" \
              -dname "CN=GRIOT AI, OU=Mobile, O=GRIOT AI, L=Luanda, ST=Luanda, C=AO"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/app/griot-release.keystore
            git commit -m "chore(release): persist permanent release keystore" || true
            git push origin HEAD:main || true
          fi

      - name: Build Release APK
        working-directory: android
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-5366468248686411~4486445388' }}
          ADMOB_NATIVE_AD_UNIT_ID: ${{ secrets.ADMOB_NATIVE_AD_UNIT_ID || 'ca-app-pub-5366468248686411/4636373215' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and Sign Release APK
        run: |
          RELEASE_APK=$(find android/app/build/outputs/apk/release -type f -name '*.apk' 2>/dev/null | head -n 1)
          ZIPALIGN_BIN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          KEYSTORE="android/app/griot-release.keystore"
          
          if [ -n "$RELEASE_APK" ] && [ -f "$KEYSTORE" ]; then
            echo "Aligning and signing Release APK with v1 + v2 + v3 schemes..."
            "$ZIPALIGN_BIN" -p -f -v 4 "$RELEASE_APK" aligned-release.apk
            "$APKSIGNER_BIN" sign \
              --ks "$KEYSTORE" \
              --ks-pass pass:"${KEYSTORE_PASSWORD:-GriotMobileApp2026!}" \
              --ks-key-alias "${KEY_ALIAS:-griot-release}" \
              --key-pass pass:"${KEY_PASSWORD:-GriotMobileApp2026!}" \
              --min-sdk-version 21 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out GRIOT-Mobile.apk \
              aligned-release.apk
            
            cp GRIOT-Mobile.apk GRIOT-Mobile-release.apk
            echo "Release APK signed successfully: GRIOT-Mobile.apk"
          elif [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" GRIOT-Mobile.apk
            cp "$RELEASE_APK" GRIOT-Mobile-release.apk
          fi

          ls -lh GRIOT-Mobile*.apk
          sha256sum GRIOT-Mobile*.apk

          AAPT2_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          if [ -n "$AAPT2_BIN" ] && [ -x "$AAPT2_BIN" ]; then
            echo "=== AAPT2 DUMP BADGING (RELEASE) ==="
            "$AAPT2_BIN" dump badging GRIOT-Mobile.apk || true
          fi

          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            echo "=== APKSIGNER VERIFY (RELEASE) ==="
            "$APKSIGNER_BIN" verify --verbose --print-certs GRIOT-Mobile.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: griot-mobile-apks
          path: GRIOT-Mobile*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            GRIOT-Mobile.apk
            GRIOT-Mobile-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          echo "Release tag $RELEASE_TAG -> $TAG_SHA"
          echo "Build commit          -> $GITHUB_SHA"
          test "$TAG_SHA" = "$GITHUB_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
