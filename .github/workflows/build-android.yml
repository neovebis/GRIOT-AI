name: GRIOT Mobile Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 platforms;android-34 build-tools;35.0.0 build-tools;34.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android Assets (Icons & Splash)
        run: node scripts/generate-android-assets.mjs

      - name: Validate runtime runner
        run: |
          node --check runtime-runner/server.mjs
          node --test runtime-runner/runtime-runner.test.mjs

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Sync GRIOT native integration
        run: node scripts/sync-griot-native.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/griot-release.keystore \
            -alias griot-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "GriotMobileApp2026!" \
            -keypass "GriotMobileApp2026!" \
            -dname "CN=GRIOT AI, OU=Mobile, O=GRIOT AI, L=Luanda, ST=Luanda, C=AO"

      - name: Build APKs (Release and Debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and Sign Release APK
        run: |
          # Gradle produces an UNSIGNED APK (no signingConfig in buildType)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -type f -name '*.apk' 2>/dev/null | head -n 1)
          ZIPALIGN_BIN=$(find "$ANDROID_HOME/build-tools/34.0.0" -name zipalign -type f 2>/dev/null || find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools/34.0.0" -name apksigner -type f 2>/dev/null || find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | head -n 1)
          KEYSTORE="android/app/griot-release.keystore"
          
          echo "Using apksigner: $APKSIGNER_BIN"
          echo "Using zipalign: $ZIPALIGN_BIN"
          echo "Using jarsigner: $(which jarsigner)"
          
          if [ -n "$RELEASE_APK" ] && [ -f "$KEYSTORE" ]; then
            echo "=== STEP 1: zipalign (on unsigned APK) ==="
            "$ZIPALIGN_BIN" -p -f -v 4 "$RELEASE_APK" aligned-unsigned.apk
            
            echo "=== STEP 2: v1 JAR signing with jarsigner (JDK) ==="
            # jarsigner ALWAYS creates v1 JAR signatures — no minSdk override issues
            # Must run AFTER zipalign because jarsigner signs in-place
            cp aligned-unsigned.apk aligned-v1signed.apk
            jarsigner -verbose \
              -keystore "$KEYSTORE" \
              -storepass "GriotMobileApp2026!" \
              -keypass "GriotMobileApp2026!" \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              aligned-v1signed.apk \
              griot-release
            echo "v1 JAR signing done."
            
            # Verify jarsigner applied correctly
            jarsigner -verify -verbose aligned-v1signed.apk | head -20 || true
            
            echo "=== STEP 3: v2+v3 signing with apksigner (preserving existing v1) ==="
            # apksigner adds v2+v3 blocks; --v1-signing-enabled false prevents it from
            # touching the existing v1 JAR signatures that jarsigner already created
            "$APKSIGNER_BIN" sign \
              --ks "$KEYSTORE" \
              --ks-pass pass:GriotMobileApp2026! \
              --ks-key-alias griot-release \
              --key-pass pass:GriotMobileApp2026! \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out GRIOT-Mobile.apk \
              aligned-v1signed.apk
            echo "Release APK signed successfully: GRIOT-Mobile.apk"
          elif [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" GRIOT-Mobile.apk
          fi

          ls -lh GRIOT-Mobile.apk
          sha256sum GRIOT-Mobile.apk

          GRADLE_VER=$(grep 'versionName' android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_TO_USE="v${GRADLE_VER:-1.0.88}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_TO_USE="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=$TAG_TO_USE" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=GRIOT Mobile $TAG_TO_USE" >> "$GITHUB_ENV"

          AAPT2_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          if [ -n "$AAPT2_BIN" ] && [ -x "$AAPT2_BIN" ]; then
            echo "=== AAPT2 DUMP BADGING (RELEASE) ==="
            "$AAPT2_BIN" dump badging GRIOT-Mobile.apk || true
          fi

          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            echo "=== APKSIGNER VERIFY (RELEASE) ==="
            "$APKSIGNER_BIN" verify --verbose --print-certs GRIOT-Mobile.apk || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: griot-mobile-apk
          path: GRIOT-Mobile.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: |
            GRIOT-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
